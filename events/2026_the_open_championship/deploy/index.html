<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueDNA — The Open Championship 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div>
      <h1>VenueDNA — <span>The Open Championship</span> 2026</h1>
      <p class="header-meta">Royal Troon · Pre-Tournament Analysis · July 17–20, 2026</p>
    </div>
  </div>
</header>

<div class="meta-bar">
  <div class="meta-bar-inner" id="model-banner">Loading model metadata…</div>
</div>

<main>

  <!-- ── Filter bar ──────────────────────────────────────────────────────── -->
  <div class="filter-bar">

    <!-- Text search: evaluated identically for FULL / DEBUT / ELITE_DEBUT rows -->
    <label for="filter-search">Search</label>
    <input
      type="search"
      id="filter-search"
      placeholder="Player name…"
      autocomplete="off"
      style="min-width:180px"
    >

    <!-- Depth filter
         Options:
           ALL       — every entry (explicit; maps both debut subclasses without
                       any per-class pointer logic)
           FULL      — players with Royal Troon course history
           IMPUTED   — DEBUT ∪ ELITE_DEBUT unified "No History" path; prevents
                       ELITE_DEBUT from being silently hidden alongside DEBUT
           DEBUT     — standard mean-imputed players only (Tier 3 / Rank 38)
           ELITE_DEBUT — elite talent gate only (Tier 1 / Rank 3)
    -->
    <label for="filter-depth">Data Depth</label>
    <select id="filter-depth">
      <option value="ALL">All</option>
      <option value="FULL">Full History</option>
      <option value="IMPUTED">Imputed / No History</option>
      <option value="DEBUT">Debut — Mean Imputed</option>
      <option value="ELITE_DEBUT">Elite Debut — T1 Gate</option>
    </select>

    <label for="filter-tier">Tier</label>
    <select id="filter-tier">
      <option value="ALL">All Tiers</option>
      <option value="1">Tier 1</option>
      <option value="2">Tier 2</option>
      <option value="3">Tier 3</option>
      <option value="4">Tier 4</option>
      <option value="5">Tier 5</option>
    </select>

  </div>

  <!-- ── Leaderboard ─────────────────────────────────────────────────────── -->
  <div class="lb-wrap">
    <table class="lb-table">
      <thead>
        <tr>
          <th class="sortable col-pos" data-sort="r1_pos">Pos</th>
          <th>Player</th>
          <th class="sortable" data-sort="pt_tier">Tier</th>
          <th class="sortable" data-sort="pt_vts">VTS</th>
          <th class="sortable col-num" data-sort="win_pct">Win %</th>
          <th class="sortable col-num" data-sort="top5_pct">Top 5 %</th>
          <th class="sortable col-num" data-sort="top10_pct">Top 10 %</th>
          <th class="sortable col-num" data-sort="sg_ott_positional">SG:OTT</th>
          <th class="sortable col-num" data-sort="driving_accuracy">Drv Acc</th>
        </tr>
      </thead>
      <tbody id="lb-body">
        <tr>
          <td colspan="9" style="text-align:center;color:var(--muted);padding:2rem">
            Loading…
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ── Pre-tournament notes ────────────────────────────────────────────── -->
  <div class="notes-panel">
    <h3 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:.75rem">
      Pre-Tournament Player Notes
    </h3>
    <div id="notes-container"></div>
  </div>

</main>

<footer>
  VenueDNA v2 · The Open Championship 2026 · Royal Troon ·
  <span style="color:var(--muted)">Pre-tournament baseline</span>
</footer>

<script src="app.js"></script>
</body>
</html>
